<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Thanks — Darstac</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0e1a; color: #e8eaf2; font-family: 'Inter', system-ui, sans-serif; padding: 1.5rem; text-align: center; }
        .card { max-width: 480px; padding: 3rem 2.5rem; background: #0f1424; border: 1px solid rgba(255,255,255,0.08); border-radius: 28px; }
        .check { width: 64px; height: 64px; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #10b981; font-size: 1.75rem; }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.75rem; letter-spacing: -0.02em; margin-bottom: 0.75rem; }
        p { color: #9ca3b8; line-height: 1.7; margin-bottom: 2rem; }
        a { display: inline-block; padding: 0.875rem 1.75rem; background: #e8eaf2; color: #0a0e1a; border-radius: 9999px; text-decoration: none; font-weight: 500; transition: transform 0.2s; }
        a:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">✓</div>
        <h1>Message sent!</h1>
        <p>Thanks for reaching out — we've got your inquiry and will reply within 24 hours.</p>
        <a href="/">Back to darstac.com</a>
    </div>
</body>
</html>
